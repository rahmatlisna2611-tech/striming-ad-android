name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir project
          unzip -q "$ZIP_FILE" -d project
      - name: Build debug APK
        run: gradle --no-daemon -p project assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: striming-a-d.apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
